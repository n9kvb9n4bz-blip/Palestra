<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Palestra"><title>Piano Palestra</title>
<style>
:root{--bg:#fff;--cd:#f4f5f9;color-scheme:light;--tx:#0f1222;--mu:#6b7085;--ac:#4f46e5;--ac2:#ecebff;--ok:#10b981;--fg:#fff;--tile:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 0}
.dt{color:var(--mu);font-size:14px;text-transform:capitalize}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0}
.dy{border:0;background:var(--cd);color:var(--tx);border-radius:16px;padding:10px 0 8px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:66px}

.dy i{width:5px;height:5px;border-radius:50%}.dy i.dot{background:var(--ac)}
.dy.on{background:var(--ac);color:var(--fg)}.dy.on span{color:var(--fg);opacity:.8}.dy.on i.dot{background:var(--fg)}
.dy.td:not(.on) b{color:var(--ac)}
.hero{background:var(--ac);color:var(--fg);border-radius:24px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h2{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px}
.hero p{margin:0;opacity:.85;font-size:14px}
.tag{display:inline-block;background:var(--fg);color:var(--ac);border-radius:10px;padding:3px 10px;font-size:12.5px;font-weight:700}
.rg{width:78px;height:78px;flex:none}.rb{fill:none;stroke:var(--fg);opacity:.25;stroke-width:6}

.tip{margin:12px 4px 4px;font-size:13px;color:var(--mu)}
.ex{display:grid;grid-template-columns:104px 1fr;gap:14px;background:var(--cd);border-radius:22px;padding:12px;margin-top:12px;align-items:center}
.ex.ok{opacity:.7}

.st{fill:none;stroke:var(--tx);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.hd{fill:var(--tile);stroke:var(--tx);stroke-width:3}
.pr,.fl{fill:none;stroke:var(--mu);stroke-width:2.5;stroke-linecap:round}
.ld{fill:var(--ac)}
.ex h3{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px}.meta span{background:var(--ac2);color:var(--ac);border-radius:10px;padding:3px 9px;font-size:12.5px;font-weight:600}
.nt{color:var(--mu);font-size:12.5px;margin-top:6px}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ch{width:44px;height:44px;border-radius:14px;border:0;background:var(--ac2);color:var(--ac);font:inherit;font-weight:800;font-size:16px;transition:transform .1s}
.ch:active{transform:scale(.92)}.ch.on{background:var(--ok);color:var(--fg)}
.rest{background:var(--cd);border-radius:24px;padding:36px 22px;text-align:center}.rest h2{margin:8px 0;font-size:24px}.rest p{color:var(--mu);margin:0}
.ft{color:var(--mu);font-size:12.5px;text-align:center;margin:20px 8px}
#tm{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,250%);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);border-radius:30px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:18px;transition:transform .25s,opacity .25s;white-space:nowrap}
#tm.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#tm button{border:0;background:var(--ac);color:var(--fg);border-radius:22px;padding:11px 18px;font:inherit;font-size:14px;font-weight:700}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

:root{--okt:#d3f3e6;--no:#e5484d}
.dy i.dn,.dy.on i.dn{background:var(--ok)}
.seg{display:flex;background:var(--cd);border-radius:14px;padding:4px;margin:16px 0 0}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:11px;border-radius:11px}
.seg button.on{background:var(--ac);color:var(--fg)}
.cn{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.cn b{font-size:18px}
.cn button{width:44px;height:44px;border:0;border-radius:14px;background:var(--cd);color:var(--tx);font-size:22px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cg small{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.cl{aspect-ratio:1;border:0;border-radius:14px;background:var(--cd);color:var(--tx);font:inherit;font-weight:600;position:relative;padding:0}
.cl.plan::after,.cl.miss::after{content:"";position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.cl.miss::after{background:var(--no)}
.cl.part{background:var(--okt);color:var(--ok)}.cl.full{background:var(--ok);color:var(--fg)}
.cl.tdy{box-shadow:inset 0 0 0 2px var(--ac)}.cl.sel{box-shadow:0 0 0 2px var(--tx)}
.lg{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 2px;font-size:12.5px;color:var(--mu)}.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:4px;display:block}.lg .full{background:var(--ok)}.lg .part{background:var(--okt);box-shadow:inset 0 0 0 1px var(--ok)}.lg .miss{background:var(--no)}.lg .plan{background:var(--ac)}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}.sm div{background:var(--cd);border-radius:18px;padding:14px;color:var(--mu);font-size:13px}
.sm b{display:block;font-size:28px;color:var(--tx);letter-spacing:-.02em}
.dtl{background:var(--cd);border-radius:22px;padding:18px}.dtl h3{margin:0;font-size:18px;text-transform:capitalize}.mu2{color:var(--mu);margin:2px 0 10px;font-size:14px}
.rw{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bg)}
.rw span{width:24px;height:24px;border-radius:8px;background:var(--bg);color:var(--mu);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.rw em{font-style:normal;flex:1;font-size:15px}.rw b{color:var(--mu);font-size:14px}.rw.d span{background:var(--ok);color:var(--fg)}.rw.p span{background:var(--okt);color:var(--ok)}
.go{width:100%;margin-top:12px;border:0;border-radius:14px;background:var(--ac);color:var(--fg);font:inherit;font-weight:700;padding:14px}

.start{width:100%;border:0;border-radius:18px;background:var(--tx);color:var(--bg);font:inherit;font-size:18px;font-weight:800;padding:18px;margin-top:12px}
.live{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--cd);border-radius:18px;padding:10px 10px 10px 18px;margin-top:12px;box-shadow:0 0 0 2px var(--ok)}
.live small{color:var(--ok);font-weight:700;display:block;font-size:12px}.live b{font-size:26px;font-variant-numeric:tabular-nums}
.live button{border:0;border-radius:14px;background:var(--no);color:#fff;font:inherit;font-weight:700;padding:13px 18px}
.ch.off{opacity:.45}
.rbt{margin-top:10px;width:100%;border:0;border-radius:12px;background:var(--ac2);color:var(--ac);font:inherit;font-weight:700;font-size:13.5px;padding:12px}
.ov{position:fixed;inset:0;background:rgba(10,12,22,.5);display:flex;align-items:flex-end;z-index:20}
.sh{width:100%;max-width:520px;margin:0 auto;background:var(--cd);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}.sh h3{margin:0;font-size:20px}
.stp{display:flex;align-items:center;gap:12px;margin:12px 0}.stp span{flex:1;font-weight:600}
.stp button{width:52px;height:52px;border:0;border-radius:16px;background:var(--ac2);color:var(--ac);font-size:26px;font-weight:700}
.stp b{min-width:60px;text-align:center;font-size:28px;font-variant-numeric:tabular-nums}
.go.alt{background:var(--ac2);color:var(--ac)}.go.del{background:none;color:var(--no)}
.rw em small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
#tm{z-index:30}
.sh{background:var(--bg)}.hero{box-shadow:0 8px 24px rgba(79,70,229,.18)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:360px){.ex{grid-template-columns:88px 1fr}}
</style></head><body><main id="app"></main><div id="tm"><span id="tt"></span><button onclick="tEnd=0">Salta</button></div>
<script>
// Pose: [testa x,y, collo x,y, anca x,y, gomito x,y, polso x,y, ginocchio x,y, piede x,y, (2a gamba: ginocchio, piede)]
const P={
bench:[[28,54,36,56,68,56,44,63,36,50,88,46,88,80],[28,54,36,56,68,56,36,44,36,32,88,46,88,80]],

hinge:[[60,22,60,30,60,54,60,44,62,56,60,68,62,82],[40,40,48,44,74,54,50,56,52,68,72,68,68,82]],
lpress:[[14,44,22,50,42,66,30,60,38,62,58,52,66,32],[14,44,22,50,42,66,30,60,38,62,62,46,80,28]],

calf:[[60,22,60,30,60,54,60,44,63,58,60,68,62,82],[60,16,60,24,60,48,60,38,63,52,60,62,62,76]],
plank:[[20,52,28,56,66,66,28,76,44,78,82,70,98,78],[20,52,28,56,66,65,28,76,44,78,82,69,98,78]],
lunge:[[60,22,60,30,60,54,60,44,63,58,60,68,64,82,58,68,54,82],[60,30,60,38,60,62,60,52,63,66,78,64,80,82,44,74,30,80]],

lext:[[44,24,44,32,46,62,50,50,58,62,72,62,74,82],[44,24,44,32,46,62,50,50,58,62,72,62,98,62]],
srow:[[50,30,50,38,50,66,68,48,86,56,76,62,78,82],[50,30,50,38,50,66,40,56,62,56,76,62,78,82]],

const PR={bench:'M14 62H100M24 62v18M92 62v18',pull:'M36 68H64M42 68v14',srow:'M36 68H64M42 68v14',lcurl:'M14 66H90',hip:'M10 58H44M18 58v22',lext:'M32 64H72M38 64v18',lpress:'M8 50L36 74'};
const NL=['plank','lext','lcurl','lpress'];
// [nome, disegno, serie, ripetizioni, recupero in secondi, nota]
const S={
ua:['Upper A','Petto, schiena, spalle, braccia','60-70 min',[
['Panca piana','bench',3,'6-10',150],['Rematore con bilanciere o manubrio','row',3,'8-10',120],['Shoulder press con manubri','press',3,'8-10',120],['Lat machine','pull',3,'10-12',90],['Curl bilanciere','curl',2,'10-12',75],['Pushdown ai cavi (tricipiti)','curl',2,'10-12',75]]],
la:['Lower A','Gambe e addome','60-70 min',[
['Squat','squat',3,'6-10',150,'Se non conosci la tecnica: goblet squat'],['Stacco rumeno','hinge',3,'8-10',150],['Leg press','lpress',2,'10-12',120],['Leg curl','lcurl',3,'10-12',90],['Calf raise (polpacci)','calf',3,'12-15',60],['Plank','plank',3,'30-45 sec',60,'Corpo dritto, tieni la posizione']]],
ub:['Upper B','Petto, schiena, spalle, braccia','60-70 min',[
['Panca inclinata con manubri','bench',3,'8-12',120],['Lat machine presa stretta','pull',3,'8-10',120],['Alzate laterali','side',3,'12-15',60,'Il braccio sale di lato, non davanti'],['Rematore al cavo (pulley)','srow',3,'10-12',90],['Curl a martello','curl',2,'10-12',75],['Tricipiti sopra la testa ai cavi','press',2,'10-12',75,'Gomiti fermi'],['Face pull','face',2,'12-15',60]]],
lb:['Lower B','Gambe e glutei','70-80 min',[
['Leg press','lpress',3,'8-12',150],['Hip thrust','hip',3,'8-12',120],['Affondi','lunge',2,'10 per gamba',90,'Alterna le gambe'],['Leg extension','lext',3,'12-15',75],['Leg curl','lcurl',2,'12-15',75],['Calf raise (polpacci)','calf',3,'12-15',60]]]};
const SES=['ua','la',null,'ub',null,null,'lb'],GG=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const now=new Date(),td=(now.getDay()+6)%7;let sel=td,f=0,tEnd=0;const M={};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const dk=i=>ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+i-td));
const get=k=>{if(k in M)return M[k];try{return+localStorage.getItem(k)||0}catch(e){return 0}};
const put=(k,v)=>{M[k]=v;try{localStorage.setItem(k,v)}catch(e){}};
const key=i=>'g:'+dk(sel)+':'+i;
const fmt=s=>s>=120?s/60+' min':s+' s';
function draw(el,k,fr){const p=P[k][fr],l=(a,b)=>`L${a} ${b}`;
let d=`M${p[2]} ${p[3]}L${p[4]} ${p[5]}M${p[2]} ${p[3]}L${p[6]} ${p[7]}L${p[8]} ${p[9]}M${p[4]} ${p[5]}L${p[10]} ${p[11]}L${p[12]} ${p[13]}`;
if(p[14])d+=`M${p[4]} ${p[5]}L${p[14]} ${p[15]}L${p[16]} ${p[17]}`;
el.innerHTML=`<path class="fl" d="M4 83H116"/><path class="pr" d="${PR[k]||''}"/><path class="st" d="${d}"/><circle class="hd" cx="${p[0]}" cy="${p[1]}" r="6"/>`+(NL.includes(k)?'':`<circle class="ld" cx="${p[8]}" cy="${p[9]}" r="4.5"/>`)}
let view='w',cy=now.getFullYear(),cm=now.getMonth(),cd=ymd(now);
const START='2026-10-05',MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const sess=ds=>{const [y,m,d]=ds.split('-').map(Number);return SES[(new Date(y,m-1,d).getDay()+6)%7]};
const stat=ds=>{const k=sess(ds);if(!k)return null;let t=0,n=0;S[k][3].forEach((e,i)=>{t+=e[2];n+=Math.min(get('g:'+ds+':'+i),e[2])});return{k,t,n}};
const dlong=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})};
function setV(v){view=v;render();window.scrollTo(0,0)}
function mv(n){cm+=n;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}render()}
function pick(ds){cd=ds;render()}
function renderC(){const off=(new Date(cy,cm,1).getDay()+6)%7,days=new Date(cy,cm+1,0).getDate(),today=ymd(now);let tw=0,ts=0,g='';
for(let i=0;i<off;i++)g+='<span></span>';
for(let d=1;d<=days;d++){const ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),s=stat(ds);let c='';
if(s){if(s.n>=s.t)c='full';else if(s.n>0)c='part';else if(ds>=START&&ds<today)c='miss';else c='plan';if(s.n>0){tw++;ts+=s.n}}
g+=`<button class="cl ${c}${ds==today?' tdy':''}${ds==cd?' sel':''}" aria-label="${dlong(ds)}" onclick="pick('${ds}')">${d}</button>`}
let h=`<div class="cn"><button aria-label="Mese precedente" onclick="mv(-1)">‹</button><b>${MESI[cm]} ${cy}</b><button aria-label="Mese successivo" onclick="mv(1)">›</button></div><div class="cg">`+['L','M','M','G','V','S','D'].map(x=>`<small>${x}</small>`).join('')+g+`</div>`;
h+=`<div class="lg"><span><i class="full"></i>Completo</span><span><i class="part"></i>Parziale</span><span><i class="miss"></i>Saltato</span><span><i class="plan"></i>Da fare</span></div><div class="sm"><div><b>${tw}</b>giorni allenati</div><div><b>${ts}</b>serie completate</div></div>`;
const s=stat(cd);h+=`<section class="dtl"><h3>${dlong(cd)}</h3>`;
if(!s)h+='<p class="mu2">Giorno di riposo.</p>';
else{const w=getJ('w:'+cd),du=w&&w.e?' · '+Math.max(1,Math.round((w.e-w.s)/60000))+' min':'';h+=`<p class="mu2">${S[s.k][0]} · ${s.n}/${s.t} serie${du}</p>`;
S[s.k][3].forEach((e,i)=>{const n=Math.min(get('g:'+cd+':'+i),e[2]),ls=(getJ('r:'+cd+':'+i)||[]).filter(Boolean).map(x=>x[0]+(x[1]?'×'+x[1]:'')).join(' · ');h+=`<div class="rw ${n>=e[2]?'d':n?'p':''}"><span>${n>=e[2]?'✓':n?'•':'–'}</span><em>${e[0]}${ls?`<small>${ls}</small>`:''}</em><b>${n}/${e[2]}</b></div>`});
if(cd>=dk(0)&&cd<=dk(6))h+=`<button class="go" onclick="view='w';go(${(new Date(cd.slice(0,4),cd.slice(5,7)-1,cd.slice(8)).getDay()+6)%7})">Apri questo allenamento</button>`}
return h+'</section>'}
function render(){const h=`<div class="dt">${now.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Il tuo piano</h1><div class="seg"><button class="${view=='w'?'on':''}" onclick="setV('w')">Allenamento</button><button class="${view=='c'?'on':''}" onclick="setV('c')">Calendario</button></div>`+(view=='c'?renderC():renderW())+sheetH();
document.getElementById('app').innerHTML=h;document.querySelectorAll('svg[data-p]').forEach(e=>draw(e,e.dataset.p,f))}
function ring(p){const r=26,c=2*Math.PI*r;return `<svg class="rg" viewBox="0 0 64 64" role="img" aria-label="Completato ${Math.round(p*100)}%"><circle cx="32" cy="32" r="${r}" class="rb"/><circle cx="32" cy="32" r="${r}" class="rf" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle">${Math.round(p*100)}%</text></svg>`}
function go(i){sel=i;render();window.scrollTo(0,0)}
function getJ(k){try{return JSON.parse(k in M?M[k]:localStorage.getItem(k))||null}catch(e){return null}}
function putJ(k,v){const t=JSON.stringify(v);M[k]=t;try{localStorage.setItem(k,t)}catch(e){}}
let sheet=null;
function renderW(){const k=SES[sel];
let h=`<nav class="wk">`;
GG.forEach((g,i)=>h+=`<button class="dy${i==sel?' on':''}${i==td?' td':''}" aria-label="${g}" onclick="go(${i})"><span>${g}</span><b>${new Date(now.getTime()+(i-td)*864e5).getDate()}</b><i class="${SES[i]?'dot':''}${stat(dk(i))&&stat(dk(i)).n>0?' dn':''}"></i></button>`);
h+='</nav>';
if(!k){h+=`<section class="rest"><div style="font-size:40px">🌙</div><h2>Giorno di riposo</h2><p>I muscoli crescono ora, non in palestra. Camminata leggera ok, proteine a ogni pasto, 7-8 ore di sonno.</p></section>`}
else{const s=S[k],ex=s[3],isT=sel==td,w=getJ('w:'+dk(sel)),lock=isT&&!w;let tot=0,dn=0;ex.forEach((e,i)=>{tot+=e[2];dn+=Math.min(get(key(i)),e[2])});
h+=`<section class="hero"><div><span class="tag">${s[2]}</span><h2>${s[0]}</h2><p>${s[1]}</p></div>${ring(tot?dn/tot:0)}</section>`;
if(lock)h+=`<button class="start" onclick="startW()">Inizia allenamento</button>`;
else if(w&&!w.e)h+=`<div class="live"><div><small>In corso</small><b id="el">0:00:00</b></div><button onclick="endW()">Termina</button></div>`;
else if(w)h+=`<p class="tip">Allenamento concluso in ${Math.max(1,Math.round((w.e-w.s)/60000))} min.</p>`;
h+=`<p class="tip">${lock?'Premi "Inizia allenamento": poi registri ripetizioni e kg di ogni serie.':'Prima: 5-10 min di riscaldamento. Ultime serie a 1-2 ripetizioni dal cedimento (settimane 1-2: più leggero).'}</p>`;
ex.forEach((e,i)=>{const d=get(key(i)),lg=getJ('r:'+dk(sel)+':'+i)||[];let c='';
for(let n=1;n<=e[2];n++)c+=`<button class="ch${n<=d?' on':''}${lock?' off':''}" aria-label="Serie ${n}" onclick="tap(${i},${n})">${n}</button>`;
const ls=lg.filter(Boolean).map(x=>x[0]+(x[1]?'×'+x[1]:'')).join(' · ');
h+=`<article class="ex${d>=e[2]?' ok':''}"><svg viewBox="0 0 120 86" data-p="${e[1]}" role="img" aria-label="${e[0]}"></svg><div><h3>${e[0]}</h3><div class="meta"><span>${e[2]} × ${e[3]}</span><span>Recupero ${fmt(e[4])}</span></div>${e[5]?`<div class="nt">${e[5]}</div>`:''}<div class="sets">${c}</div>${ls?`<div class="nt">${ls}${/sec/.test(e[3])?'':' (rip × kg)'}</div>`:''}<button class="rbt" onclick="rest(${i})">Avvia recupero · ${fmt(e[4])}</button></div></article>`});
h+=`<p class="ft">Disegni schematici, visti di lato. Fai controllare la tecnica a un istruttore nelle prime sedute.</p>`}
return h}
function sheetH(){if(!sheet)return'';const e=S[SES[sel]][3][sheet.i],pl=/sec/.test(e[3]),dn=get(key(sheet.i))>=sheet.n;
return `<div class="ov" onclick="sheet=null;render()"><div class="sh" onclick="event.stopPropagation()"><h3>${e[0]}</h3><p class="mu2">Serie ${sheet.n} di ${e[2]} · obiettivo ${e[3]}</p><div class="stp"><span>${pl?'Secondi':'Ripetizioni'}</span><button aria-label="Meno" onclick="adj('r',-1)">−</button><b id="vr">${sheet.r}</b><button aria-label="Più" onclick="adj('r',1)">+</button></div>${pl?'':`<div class="stp"><span>Peso (kg)</span><button aria-label="Meno" onclick="adj('k',-2.5)">−</button><b id="vk">${sheet.k}</b><button aria-label="Più" onclick="adj('k',2.5)">+</button></div>`}<button class="go" onclick="saveS(0)">Salva serie</button><button class="go alt" onclick="saveS(1)">Salva e avvia recupero</button>${dn?`<button class="go del" onclick="delS()">Rimuovi serie</button>`:''}</div></div>`}
function startW(){putJ('w:'+dk(sel),{s:Date.now()});render()}
function endW(){const w=getJ('w:'+dk(sel));if(w){w.e=Date.now();putJ('w:'+dk(sel),w)}tEnd=0;render()}
function rest(i){tEnd=Date.now()+S[SES[sel]][3][i][4]*1000}
function tap(i,n){if(sel!=td){const c=get(key(i));put(key(i),c==n?n-1:n);render();return}
if(!getJ('w:'+dk(sel))){const b=document.querySelector('.start');b&&b.scrollIntoView({block:'center'});return}
const e=S[SES[sel]][3][i],lg=getJ('r:'+dk(sel)+':'+i)||[],cur=lg[n-1],pv=lg.filter(Boolean).pop(),nm=e[3].match(/\d+/g),df=/sec/.test(e[3])?+nm[0]:+nm[nm.length-1],lk=getJ('k:'+e[0]);
sheet={i,n,r:cur?cur[0]:pv?pv[0]:df,k:cur?cur[1]:pv?pv[1]:(lk||0)};render()}
function adj(t,d){sheet[t]=Math.max(0,+(sheet[t]+d).toFixed(1));document.getElementById(t=='r'?'vr':'vk').textContent=sheet[t]}
function saveS(rs){const {i,n,r,k}=sheet,e=S[SES[sel]][3][i],kk='r:'+dk(sel)+':'+i,lg=getJ(kk)||[];lg[n-1]=[r,k];putJ(kk,lg);put(key(i),Math.max(get(key(i)),n));if(k)putJ('k:'+e[0],k);if(rs)tEnd=Date.now()+e[4]*1000;sheet=null;try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}render()}
function delS(){const {i,n}=sheet,kk='r:'+dk(sel)+':'+i,lg=getJ(kk)||[];lg.length=Math.min(lg.length,n-1);putJ(kk,lg);put(key(i),n-1);sheet=null;render()}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{f^=1;document.querySelectorAll('svg[data-p]').forEach(e=>draw(e,e.dataset.p,f))},900);
setInterval(()=>{const t=document.getElementById('tm'),r=Math.ceil((tEnd-Date.now())/1000);
if(r>0&&!sheet){t.classList.add('show');document.getElementById('tt').textContent='Recupero '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0')}else{if(r<=0&&t.classList.contains('show')){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}t.classList.remove('show')}
const el=document.getElementById('el'),w=getJ('w:'+dk(sel));if(el&&w&&!w.e){const m=Math.floor((Date.now()-w.s)/1000);el.textContent=Math.floor(m/3600)+':'+String(Math.floor(m%3600/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}},500);
render();
</script></body></html>
